<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Prep</title>
<style>
  :root { --bg:#0f1419; --panel:#161c24; --line:#2a3340; --fg:#e8edf2; --muted:#8aa0ad; --accent:#2f8f7f; --danger:#b5535a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; -webkit-text-size-adjust: 100%; }

  /* ---------- login ---------- */
  #login { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; }
  #login.show { display: flex; }
  .card { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  .card h1 { font-size: 18px; margin: 0 0 4px; }
  .card .sub { color: var(--muted); font-size: 12.5px; margin: 0 0 20px; }
  .card label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 6px; }
  .card input { width: 100%; padding: 12px 14px; font-size: 16px; color: var(--fg); background: #0c1116; border: 1px solid var(--line); border-radius: 10px; outline: none; }
  .card input:focus { border-color: var(--accent); }
  .card button { width: 100%; margin-top: 16px; padding: 12px; font-size: 15px; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 10px; cursor: pointer; }
  .card button:disabled { opacity: .6; cursor: default; }
  .msg { min-height: 18px; margin-top: 12px; font-size: 12.5px; }
  .msg.err { color: var(--danger); }
  .msg.warn { color: #d6a249; }

  /* ---------- app ---------- */
  #app { position: fixed; inset: 0; display: none; flex-direction: column; }
  #app.show { display: flex; }
  .panes { flex: 1; display: flex; min-height: 0; }
  .pane { min-width: 0; min-height: 0; height: 100%; }
  .pane iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
  #leftPane { flex: 0 0 50%; }
  #rightPane { flex: 1; }
  .divider { flex: 0 0 1px; background: var(--line); }
  .collapseHandle {
    position: fixed; top: 50%; transform: translateY(-50%);
    z-index: 20; width: 34px; height: 72px; display: none;
    align-items: center; justify-content: center; cursor: pointer;
    font-size: 26px; font-weight: 800; line-height: 1; box-shadow: 0 8px 28px rgba(0,0,0,.35);
  }
  .collapseHandle:hover { filter: brightness(1.08); }
  /* restore handle — teal, pinned to the right edge, shown only when the co-pilot is collapsed */
  #expandCopilot {
    right: 0; border: 1px solid #2b3645; border-right: 0; border-radius: 12px 0 0 12px;
    background: #11212c; color: #cdd9e0;
  }
  #expandCopilot:hover { background: #1b3340; color: #fff; filter: none; }
  #app.split-collapsed #expandCopilot { display: flex; }
  /* collapse handle — navy (matches the doc's nav button), sits at the pane seam, shown only when expanded */
  #collapseCopilot {
    left: 50%; border: 1px solid #2b3645; border-right: 0; border-radius: 12px 0 0 12px;
    background: #11212c; color: #cdd9e0;
  }
  #collapseCopilot:hover { background: #1b3340; color: #fff; filter: none; }
  #app:not(.split-collapsed) #collapseCopilot { display: flex; }
  #app.split-collapsed #rightPane { flex: 0 0 0 !important; width: 0; overflow: hidden; }
  #app.split-collapsed #divider { display: none; }

  @media (max-width: 760px) {
    .panes { flex-direction: column; }
    #leftPane { flex: 0 0 55%; }
    .divider { display: none; }
  }
</style>
</head>
<body>

  <!-- LOGIN -->
  <div id="login">
    <form class="card" id="loginForm" autocomplete="off">
      <label for="pw">密码 · Password</label>
      <input id="pw" type="password" autocomplete="current-password" inputmode="text" />
      <button id="enterBtn" type="submit">进入 · Enter</button>
      <div class="msg" id="loginMsg"></div>
    </form>
  </div>

  <!-- APP -->
  <div id="app">
    <div class="panes">
      <div class="pane" id="leftPane"></div>
      <div class="divider" id="divider"></div>
      <div class="pane" id="rightPane"></div>
    </div>
    <button class="collapseHandle" id="collapseCopilot" type="button" title="收起实时助手">&rsaquo;</button>
    <button class="collapseHandle" id="expandCopilot" type="button" title="展开实时助手">&lsaquo;</button>
  </div>

<script>
(function () {
  var loginEl = document.getElementById('login');
  var appEl = document.getElementById('app');
  var form = document.getElementById('loginForm');
  var pw = document.getElementById('pw');
  var btn = document.getElementById('enterBtn');
  var msg = document.getElementById('loginMsg');
  var expandCopilot = document.getElementById('expandCopilot');
  var collapseCopilot = document.getElementById('collapseCopilot');

  function showLogin(text, cls) {
    appEl.classList.remove('show');
    loginEl.classList.add('show');
    if (text != null) { msg.textContent = text; msg.className = 'msg ' + (cls || ''); }
    setTimeout(function () { pw.focus(); }, 50);
  }

  function buildPanes() {
    var search = window.location.search || '';
    // Left = your prep doc (served only to an authenticated request).
    var left = document.getElementById('leftPane');
    if (!left.firstChild) {
      var f1 = document.createElement('iframe');
      f1.src = '/api/doc';
      f1.title = '面试准备';
      left.appendChild(f1);
    }
    // Right = the live co-pilot. Forward ?room / ?view through to it, and grant
    // the mic permission the iframe needs to capture audio.
    var right = document.getElementById('rightPane');
    if (!right.firstChild) {
      var f2 = document.createElement('iframe');
      f2.src = '/copilot.html' + search;
      f2.title = '实时助手';
      f2.setAttribute('allow', 'microphone; clipboard-read; clipboard-write');
      right.appendChild(f2);
    }
  }

  function showApp() {
    loginEl.classList.remove('show');
    appEl.classList.add('show');
    buildPanes();
    applySplit(getSplit());
  }

  // Decide login vs. app on load — the 1-year cookie means no re-login on refresh.
  function check() {
    fetch('/api/gate', { method: 'GET', headers: { 'Accept': 'application/json' } })
      .then(function (r) {
        var ct = r.headers.get('content-type') || '';
        if (!r.ok || ct.indexOf('application/json') < 0) throw new Error('no_backend');
        return r.json();
      })
      .then(function (j) {
        if (j && j.authed) { showApp(); return; }
        if (j && j.configured === false) {
          showLogin('服务器还没设置密码：在 Vercel 里加环境变量 COPILOT_PASS 后重新部署。', 'warn');
          btn.disabled = true;
          return;
        }
        showLogin('', '');
      })
      .catch(function () {
        // Most common cause: opened on GitHub Pages (static, no /api backend).
        showLogin('后端不可用 — 请用 Vercel 的网址打开本页（不要用 github.io / GitHub Pages）。', 'err');
        btn.disabled = true;
      });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var val = pw.value;
    if (!val) { showLogin('请输入密码。', 'err'); return; }
    btn.disabled = true; msg.textContent = '校验中…'; msg.className = 'msg';
    fetch('/api/gate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: val })
    })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        btn.disabled = false;
        if (j && j.ok) { pw.value = ''; showApp(); }
        else if (j && j.error === 'not_configured') { showLogin('服务器还没设置密码（COPILOT_PASS）。', 'warn'); }
        else { showLogin('密码不对，再试一次。', 'err'); pw.select(); }
      })
      .catch(function () { btn.disabled = false; showLogin('网络错误，请重试。', 'err'); });
  });

  // ---------- pane split presets (1:1 / 3:1 / 1:0) ----------
  // The co-pilot iframe posts {type:'cp-layout', ratio} when its layout buttons
  // are tapped. No freeform dragging — only these preset widths:
  //   1:1 -> left 50% / right 50%   ·   3:1 -> left 75% / right 25%
  //   1:0 -> left 100% / right collapsed, with a small restore handle.
  var SPLIT_KEY = 'cp_split_v1';
  function normalizeSplit(ratio) {
    return (ratio === '3:1' || ratio === '1:0') ? ratio : '1:1';
  }
  function getSplit() {
    var v; try { v = localStorage.getItem(SPLIT_KEY); } catch (e) {}
    return normalizeSplit(v);
  }
  function tellCopilot(ratio) {
    var right = document.getElementById('rightPane');
    var frame = right && right.querySelector('iframe');
    try { if (frame && frame.contentWindow) frame.contentWindow.postMessage({ type: 'cp-layout-set', ratio: ratio }, location.origin); } catch (e) {}
  }
  // Pin the collapse handle to the pane seam (the right pane's left edge), so it
  // tracks the 1:1 / 3:1 ratio and any window resize.
  function positionCollapse() {
    var right = document.getElementById('rightPane');
    if (!collapseCopilot || !right) return;
    // Sit the handle just OUTSIDE the right pane (its right edge meets the seam), so it
    // never overlaps the co-pilot's answer text.
    var w = collapseCopilot.offsetWidth || 34;
    collapseCopilot.style.left = (right.getBoundingClientRect().left - w) + 'px';
  }
  function applySplit(ratio) {
    ratio = normalizeSplit(ratio);
    try { localStorage.setItem(SPLIT_KEY, ratio); } catch (e) {}
    var left = document.getElementById('leftPane');
    var right = document.getElementById('rightPane');
    appEl.classList.toggle('split-collapsed', ratio === '1:0');
    if (left) left.style.flex = (ratio === '1:0') ? '1 1 100%' : ((ratio === '3:1') ? '0 0 75%' : '0 0 50%');
    if (right) right.style.flex = (ratio === '1:0') ? '0 0 0' : '1';
    tellCopilot(ratio);
    requestAnimationFrame(positionCollapse);
  }
  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin) return;
    if (e.data && e.data.type === 'cp-layout') applySplit(e.data.ratio);
  });
  if (expandCopilot) {
    expandCopilot.addEventListener('click', function () { applySplit('3:1'); });
  }
  if (collapseCopilot) {
    collapseCopilot.addEventListener('click', function () { applySplit('1:0'); });
  }
  window.addEventListener('resize', positionCollapse);

  check();
})();
</script>
</body>
</html>
